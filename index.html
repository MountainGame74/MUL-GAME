<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Grumpy Mule - Final Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background-color: #f7f7f7; 
            font-family: 'Courier New', Courier, monospace; 
        }
        #game-container { 
            width: 100%; 
            height: 400px; 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
        }
        canvas { display: block; width: 100%; height: 400px; background-color: #f7f7f7; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- CHARGEMENT DES IMAGES ---
        const imgMule1 = new Image();
        imgMule1.src = 'mule1.png'; // Marche frame 1
        const imgMule2 = new Image();
        imgMule2.src = 'mule2.png'; // Marche frame 2
        const imgMuleDead = new Image();
        imgMuleDead.src = 'mule_dead.png'; // Image de l'inspi (Game Over)

        let imagesLoaded = 0;
        const allImages = [imgMule1, imgMule2, imgMuleDead];
        allImages.forEach(img => {
            img.onload = () => { 
                imagesLoaded++; 
                if(imagesLoaded === allImages.length) loop(); 
            };
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = 400;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PARAMÈTRES DU JEU ---
        let score = 0;
        let highScore = localStorage.getItem('muleHighScore') || 0;
        let gameSpeed = 5;
        let isGameOver = false;
        let gravity = 0.8;
        let obstacles = [];
        let nextObstacleFrame = 100;
        const groundY = 350;

        let keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // --- LA MULE ---
        let mule = { 
            x: 50, 
            y: groundY - 92, 
            width: 88,  // Taille de ton image
            height: 92, 
            dy: 0, 
            jumpForce: 18, 
            grounded: false,
            // Animation
            currentFrame: 1,
            frameTimer: 0,
            frameSpeed: 10 
        };

        // --- DESSIN DES ÉLÉMENTS ---
        function drawCactus(x, y, w, h) {
            ctx.fillStyle = "#000000";
            let trunkW = w/3;
            ctx.fillRect(x + trunkW, y, trunkW, h);
            ctx.fillRect(x, y + h/2.5, w, 6);
            ctx.fillRect(x, y + h/5, 6, h/4);
            ctx.fillRect(x + w - 6, y + h/5, 6, h/4);
        }

        function drawBird(x, y, w, h) {
            ctx.fillStyle = "#757575";
            ctx.fillRect(x, y + 8, w, 12);
            ctx.fillRect(x + w - 12, y, 12, 10);
            let wingPos = Math.sin(Date.now() / 80) > 0 ? -15 : 15;
            ctx.fillRect(x + 15, y + 10, 12, wingPos); 
        }

        function resetGame() {
            score = 0; gameSpeed = 5; obstacles = []; isGameOver = false;
            mule.y = groundY - 92; mule.dy = 0; nextObstacleFrame = 100;
        }

        // --- LOGIQUE PRINCIPALE ---
        function loop() {
            if (imagesLoaded < allImages.length) return;

            if (!isGameOver) {
                // Saut (Espace ou Flèche Haut)
                if ((keys['Space'] || keys['ArrowUp']) && mule.grounded) {
                    mule.dy = -mule.jumpForce;
                    mule.grounded = false;
                }

                // Physique
                mule.dy += gravity;
                mule.y += mule.dy;
                if (mule.y + mule.height > groundY) { 
                    mule.y = groundY - mule.height; 
                    mule.dy = 0; 
                    mule.grounded = true; 
                }

                // Animation des pattes
                if (mule.grounded) {
                    mule.frameTimer++;
                    if (mule.frameTimer >= mule.frameSpeed) {
                        mule.frameTimer = 0;
                        mule.currentFrame = (mule.currentFrame === 1) ? 2 : 1;
                    }
                } else {
                    mule.currentFrame = 1; // Pose fixe en l'air
                }

                // Apparition obstacles (Crescendo)
                if (nextObstacleFrame <= 0) {
                    let rand = Math.random();
                    if (rand < 0.35) { // Oiseau
                        obstacles.push({ x: canvas.width, y: groundY - 85, w: 50, h: 30, type: 'bird' });
                    } else { // Cactus (max 2 côte à côte)
                        let group = Math.random() > 0.8 ? 2 : 1;
                        let h = (Math.random() > 0.5) ? 50 : 70;
                        for(let i=0; i<group; i++) {
                            obstacles.push({ x: canvas.width + (i*40), y: groundY - h, w: 35, h: h, type: 'cactus' });
                        }
                    }
                    nextObstacleFrame = 120 + Math.random() * 100 - Math.min(50, score/2);
                }
                nextObstacleFrame--;

                // Gestion collisions et vitesse
                obstacles.forEach((obs, i) => {
                    obs.x -= gameSpeed;
                    
                    // Hitbox "Fair Play" : on réduit la zone de collision de 12px
                    let m = 12; 
                    if (mule.x + m < obs.x + obs.w - m && 
                        mule.x + mule.width - m > obs.x + m && 
                        mule.y + m < obs.y + obs.h - m && 
                        mule.y + mule.height - m > obs.y + m) {
                        isGameOver = true;
                        if (score > highScore) { 
                            highScore = score; 
                            localStorage.setItem('muleHighScore', highScore); 
                        }
                    }
                    if (obs.x + obs.w < 0) { 
                        obstacles.splice(i, 1); 
                        score++; 
                        gameSpeed += 0.025; 
                    }
                });
            } else if (keys['Space'] || keys['ArrowUp']) {
                resetGame();
            }

            draw();
            requestAnimationFrame(loop);
        }

        // --- DESSIN DU CANVAS ---
        function draw() {
            ctx.fillStyle = "#f7f7f7";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Sol noir (style inspi)
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, groundY, canvas.width, 2);
            
            // Petites poussières de sol (Sable)
            ctx.fillStyle = "#535353"; 
            for(let i=0; i<canvas.width; i+=150) { 
                let xPos = (i + (Date.now()/15 % 150));
                ctx.fillRect(canvas.width - xPos, groundY + 8, 3, 1.5); 
            }

            // Dessin de la Mule
            if (!isGameOver) {
                let img = (mule.currentFrame === 1) ? imgMule1 : imgMule2;
                ctx.drawImage(img, mule.x, mule.y, mule.width, mule.height);
            } else {
                ctx.drawImage(imgMuleDead, mule.x, mule.y, mule.width, mule.height);
            }
            
            // Obstacles
            obstacles.forEach(obs => {
                if (obs.type === 'bird') drawBird(obs.x, obs.y, obs.w, obs.h);
                else drawCactus(obs.x, obs.y, obs.w, obs.h);
            });

            // UI Scores
            ctx.fillStyle = "#535353";
            ctx.font = "20px Courier New"; ctx.textAlign = "right";
            ctx.fillText(score.toString().padStart(5, '0'), canvas.width - 20, 40);
            ctx.fillStyle = "#999"; 
            ctx.fillText("HI " + highScore.toString().padStart(5, '0'), canvas.width - 20, 65);

            if (isGameOver) {
                ctx.textAlign = "center"; ctx.fillStyle = "#535353"; ctx.font = "bold 26px Courier New";
                ctx.fillText("GAME OVER", canvas.width/2, 180);
                ctx.font = "16px Courier New";
                ctx.fillText("CLIQUE OU ESPACE POUR REJOUER", canvas.width/2, 220);
            }
        }
    </script>
</body>
</html>
